<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Should I Evolve This Pokémon?</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="container">

    <h1>Should I evolve this Pokémon?</h1>

    <p class="subtitle">
        Search for a Pokémon and find out if evolving is recommended.
    </p>

    <div class="search-box">

        <div class="autocomplete">
            <input
                type="text"
                id="pokemonInput"
                placeholder="Search Pokémon..."
                autocomplete="off"
            >

            <div id="suggestions" class="suggestions"></div>
        </div>

        <button id="searchButton">
            Check Pokémon
        </button>

    </div>

    <div id="result" class="result hidden">

        <div id="loading" class="loading hidden">
            Loading...
        </div>

        <div id="pokemonInfo">

            <h2 id="pokemonName"></h2>

           <div id="evolutionDisplay"></div>

<div id="statsComparison"></div>

<div id="recommendation" class="recommendation"></div>

<div id="evolutionInfo"></div>

            <div id="recommendation" class="recommendation"></div>

            <div id="evolutionInfo"></div>

        </div>

    </div>

    <p id="errorMessage" class="error"></p>

</main>

<script src="script.js"></script>

</body> </html>
