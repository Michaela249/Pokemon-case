<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should I Evolve This Pokemon?</title>
  <!-- PapaParse pre načítanie pokemon.csv -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      width: 65%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      background-color: white;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    button {
      padding: 12px 24px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #dc2626;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .images-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .pokemon-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 50%;
      padding: 10px;
      border: 1px solid #e2e8f0;
    }

    .evo-arrow {
      font-size: 28px;
      color: #94a3b8;
    }

    .recommendation {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .recommendation.yes {
      background-color: #dcfce7;
      color: #15803d;
    }

    .recommendation.no {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .evolution-details {
      margin-bottom: 20px;
      font-size: 16px;
    }

    .stats-container {
      margin-top: 20px;
    }

    .stats-container h3 {
      margin-bottom: 12px;
      color: #334155;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .stats-table th, .stats-table td {
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .stats-table th {
      background-color: #f1f5f9;
      color: #475569;
    }

    .total-row {
      background-color: #f8fafc;
    }

    .positive {
      color: #16a34a;
      font-weight: bold;
    }

    .negative {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Should I Evolve This Pokemon?</h1>
    <p class="subtitle">Select or search for a Pokémon to check if you should evolve it.</p>

    <div class="search-box">
      <!-- Datalist pre našepkávanie názvov Pokémonov -->
      <input type="text" id="pokemonInput" list="pokemonDatalist" placeholder="Type a Pokémon name..." autocomplete="off">
      <datalist id="pokemonDatalist"></datalist>
      <button id="searchBtn">Check</button>
    </div>

    <div id="resultCard" class="card" style="display: none;">
      <div id="pokemonHeader">
        <h2 id="pokeName"></h2>
        <div id="pokeImages" class="images-container"></div>
      </div>

      <div id="recommendationBadge" class="recommendation"></div>
      <div id="evolutionInfo" class="evolution-details"></div>
      <div id="statsComparison" class="stats-container"></div>
    </div>
  </main>

  <script>
    let allPokemon = [];
    const imageBaseUrl = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

    document.addEventListener("DOMContentLoaded", () => {
      loadPokemonData();

      document.getElementById("searchBtn").addEventListener("click", handleSearch);
      
      // Vyhodnotenie po stlačení Enter
      document.getElementById("pokemonInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSearch();
      });

      // Vyhodnotenie po kliknutí/výbere konkrétneho názvu zo zoznamu datalistu
      document.getElementById("pokemonInput").addEventListener("input", (e) => {
        const val = e.target.value.trim().toLowerCase();
        const exists = allPokemon.some(p => p.pokemon && p.pokemon.toLowerCase() === val);
        if (exists) {
          handleSearch();
        }
      });
    });

    async function loadPokemonData() {
      try {
        const response = await fetch("./pokemon.csv");
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (results) => {
            allPokemon = results.data;
            populateDatalist();
          }
        });
      } catch (err) {
        console.error("Error loading CSV file:", err);
      }
    }

    // Naplnenie našepkávača Pokémonmi z CSV
    function populateDatalist() {
      const datalist = document.getElementById("pokemonDatalist");
      datalist.innerHTML = "";
      allPokemon.forEach(p => {
        if (p.pokemon) {
          const option = document.createElement("option");
          option.value = capitalize(p.pokemon);
          datalist.appendChild(option);
        }
      });
    }

    function handleSearch() {
      const inputVal = document.getElementById("pokemonInput").value.trim().toLowerCase();
      if (!inputVal) return;

      const currentPokemon = allPokemon.find(p => p.pokemon && p.pokemon.toLowerCase() === inputVal);

      if (!currentPokemon) {
        return;
      }

      displayResult(currentPokemon);
    }

    function displayResult(current) {
      const resultCard = document.getElementById("resultCard");
      const pokeName = document.getElementById("pokeName");
      const pokeImages = document.getElementById("pokeImages");
      const recommendationBadge = document.getElementById("recommendationBadge");
      const evolutionInfo = document.getElementById("evolutionInfo");
      const statsComparison = document.getElementById("statsComparison");

      resultCard.style.display = "block";
      pokeName.textContent = capitalize(current.pokemon);

      const nextEvolutions = allPokemon.filter(p => p.evolves_from_species_id === current.species_id);

      pokeImages.innerHTML = "";
      const currentImg = getImageUrl(current);
      if (currentImg) {
        pokeImages.appendChild(createImageElement(currentImg, current.pokemon));
      }

      if (nextEvolutions.length > 0) {
        const targetEvo = nextEvolutions[0];

        const nextImg = getImageUrl(targetEvo);
        if (nextImg) {
          const arrow = document.createElement("span");
          arrow.className = "evo-arrow";
          arrow.textContent = "➔";
          pokeImages.appendChild(arrow);
          pokeImages.appendChild(createImageElement(nextImg, targetEvo.pokemon));
        }

        recommendationBadge.textContent = "YES, EVOLVE IT!";
        recommendationBadge.className = "recommendation yes";

        evolutionInfo.innerHTML = `<p><strong>${capitalize(current.pokemon)}</strong> evolves into <strong>${capitalize(targetEvo.pokemon)}</strong>.</p>`;

        renderStatsTable(current, targetEvo, statsComparison);
      } else {
        recommendationBadge.textContent = "NO, CANNOT EVOLVE";
        recommendationBadge.className = "recommendation no";

        evolutionInfo.innerHTML = `<p><strong>${capitalize(current.pokemon)}</strong> is already at its final stage and has no further evolutions.</p>`;
        statsComparison.innerHTML = renderSingleStatsTable(current);
      }
    }

    function getImageUrl(pokemonObj) {
      if (pokemonObj.url_image) {
        return imageBaseUrl + pokemonObj.url_image;
      }
      if (pokemonObj.id) {
        return `${imageBaseUrl}${pokemonObj.id}.png`;
      }
      return null;
    }

    function createImageElement(src, altText) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = altText;
      img.className = "pokemon-img";
      return img;
    }

    function renderStatsTable(current, next, container) {
      const statsKeys = [
        { name: "HP", key: "hp" },
        { name: "Attack", key: "attack" },
        { name: "Defense", key: "defense" },
        { name: "Special Attack", key: "special_attack" },
        { name: "Special Defense", key: "special_defense" },
        { name: "Speed", key: "speed" }
      ];

      let currentTotal = 0;
      let nextTotal = 0;

      let rowsHtml = statsKeys.map(s => {
        const val1 = current[s.key] || 0;
        const val2 = next[s.key] || 0;
        const diff = val2 - val1;
        currentTotal += val1;
        nextTotal += val2;

        const diffText = diff > 0 ? `+${diff}` : diff;
        const diffClass = diff > 0 ? "positive" : diff < 0 ? "negative" : "";

        return `
          <tr>
            <td>${s.name}</td>
            <td>${val1}</td>
            <td>${val2}</td>
            <td class="${diffClass}">${diffText}</td>
          </tr>
        `;
      }).join("");

      const totalDiff = nextTotal - currentTotal;
      const totalDiffText = totalDiff > 0 ? `+${totalDiff}` : totalDiff;

      container.innerHTML = `
        <h3>Stats Comparison</h3>
        <table class="stats-table">
          <thead>
            <tr>
              <th>Stat</th>
              <th>${capitalize(current.pokemon)}</th>
              <th>${capitalize(next.pokemon)}</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
            <tr class="total-row">
              <td><strong>Total Stats</strong></td>
              <td><strong>${currentTotal}</strong></td>
              <td><strong>${nextTotal}</strong></td>
              <td class="positive"><strong>${totalDiffText}</strong></td>
            </tr>
          </tbody>
        </table>
      `;
    }

    function renderSingleStatsTable(current) {
      const statsKeys = [
        { name: "HP", key: "hp" },
        { name: "Attack", key: "attack" },
        { name: "Defense", key: "defense" },
        { name: "Special Attack", key: "special_attack" },
        { name: "Special Defense", key: "special_defense" },
        { name: "Speed", key: "speed" }
      ];

      let total = 0;
      let rowsHtml = statsKeys.map(s => {
        const val = current[s.key] || 0;
        total += val;
        return `
          <tr>
            <td>${s.name}</td>
            <td>${val}</td>
          </tr>
        `;
      }).join("");

      return `
        <h3>Current Stats</h3>
        <table class="stats-table">
          <thead>
            <tr>
              <th>Stat</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
            <tr class="total-row">
              <td><strong>Total Stats</strong></td>
              <td><strong>${total}</strong></td>
            </tr>
          </tbody>
        </table>
      `;
    }

    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }
  </script>
</body>
</html>
