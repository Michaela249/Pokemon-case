<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should I Evolve This Pokemon?</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

  <main class="container">
    <h1>Should I Evolve This Pokemon?</h1>
    <p class="subtitle">Search or select a Pokémon to see if it can evolve and compare its stats.</p>

    <div class="search-box">
      <input type="text" id="pokemonInput" list="pokemonDatalist" placeholder="Type a Pokémon name..." autocomplete="off">
      <datalist id="pokemonDatalist"></datalist>
      <button id="searchBtn">Check</button>
    </div>

    <div id="resultCard" class="card" style="display: none;">
      <div id="pokemonHeader">
        <h2 id="pokeName"></h2>
        <div id="pokeImages" class="images-container"></div>
      </div>

      <div id="recommendationBadge" class="recommendation"></div>

      <div id="evolutionInfo" class="evolution-details"></div>

      <div id="statsComparison" class="stats-container"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
